<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quantum Optics Lab</title>
<style>
:root{--bg:#050507;--line:rgba(255,255,255,.09);--fg:#ededf0;--mut:#8b8b96;--red:#e11d2e;--red2:#ff3b3b;--ac:#ff3b3b;color-scheme:dark;box-sizing:border-box}
html,body{height:100%;margin:0;color:var(--fg);font:14px/1.4 Inter,ui-sans-serif,-apple-system,'SF Pro Text',system-ui,sans-serif;overflow:hidden;overflow-x:clip;overscroll-behavior:none;max-width:100vw;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:radial-gradient(700px 260px at 50% -60px,rgba(225,29,46,.18),transparent 70%),var(--bg)}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
button{transition:transform .15s,color .2s,box-shadow .2s}button:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:scale(.99)}}
nav{display:flex;gap:2px;padding:6px 10px 0;overflow-x:auto;flex:none;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mut);padding:0 14px;min-height:44px;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
nav button.on{color:#fff;border-bottom-color:var(--red2);box-shadow:0 10px 18px -12px var(--red2)}
#stage{flex:1;position:relative;min-height:0;margin:10px 12px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#030304;box-shadow:0 24px 60px rgba(0,0,0,.6)}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55));box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;animation:rise .45s ease}
#panel{flex:none;position:relative;max-height:38vh;overflow:auto;overscroll-behavior:contain;margin:10px 12px 12px;padding:0 16px 14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,#131318,#0c0c10);box-shadow:0 -1px 0 rgba(225,29,46,.4),0 20px 40px rgba(0,0,0,.5);scrollbar-width:thin;scrollbar-color:#3a3a44 transparent}
#panel:not(.open){max-height:none;overflow:visible}
#panel:not(.open) #ctl{display:none}
#grip{display:block;position:sticky;top:0;z-index:2;width:calc(100% + 32px);margin:0 -16px;height:26px;background:#131318;border:0;border-radius:14px 14px 0 0;padding:0;cursor:pointer}
#grip span{display:block;width:36px;height:3px;border-radius:2px;background:#3a3a44;margin:0 auto}
#ro{font:12.5px/1.55 ui-monospace,'SF Mono',Menlo,Consolas,monospace;color:var(--mut);border-left:2px solid var(--red);padding:6px 0 6px 12px;margin:0 0 10px;min-height:1.5em;background:linear-gradient(90deg,rgba(225,29,46,.1),transparent)}
#ro b{color:#fff;font-weight:600}
#ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 16px}
#ctl label{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;margin:9px 0;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
#ctl b{color:#fff;font:600 12px ui-monospace,Menlo,monospace;letter-spacing:0}
#ctl select{min-height:40px;font:13px Inter,system-ui,sans-serif;letter-spacing:0;text-transform:none;background:#0a0a0d;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:0 10px}
#ctl input[type=checkbox]{accent-color:var(--red);width:22px;height:22px}
#ctl input[type=range]{flex:1 1 100%;-webkit-appearance:none;appearance:none;background:transparent;height:28px;margin:0}
#ctl input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--red2) var(--p,50%),rgba(255,255,255,.14) var(--p,50%))}
#ctl input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,255,255,.14)}
#ctl input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--red2)}
#ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8.5px;border-radius:50%;background:#0a0a0d;border:2px solid var(--red2);box-shadow:0 0 0 4px rgba(225,29,46,.16),0 2px 8px rgba(0,0,0,.6)}
#ctl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#0a0a0d;border:2px solid var(--red2)}
#walk{grid-column:1/-1;width:100%;min-height:48px;margin-top:6px;border:0;border-radius:12px;background:linear-gradient(180deg,#ff3b3b,#c4141f);color:#fff;font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 10px 26px rgba(225,29,46,.35),inset 0 1px 0 rgba(255,255,255,.3);touch-action:none}
#hint,#reset{z-index:3;background:rgba(8,8,10,.72);border:1px solid var(--line);color:var(--fg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;font-size:12px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;max-width:76%;overflow:hidden;text-overflow:ellipsis}
#hint.on{opacity:1}
#reset{display:none;position:absolute;right:10px;top:7px;width:44px;height:44px;border-radius:50%;font-size:18px}
.sl{flex:1 1 100%;position:relative;height:40px;touch-action:pan-y;cursor:pointer;margin:0;-webkit-touch-callout:none}
.sl-t{position:absolute;left:12px;right:12px;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:rgba(255,255,255,.14)}
.sl-f{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--red2)}
.sl-h{position:absolute;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;touch-action:pan-y;outline:none;cursor:grab}
.sl-h::before{content:'';width:20px;height:20px;border-radius:50%;background:#0a0a0d;border:2px solid var(--red2);box-shadow:0 0 0 4px rgba(225,29,46,.16),0 2px 8px rgba(0,0,0,.6);transition:transform .15s,box-shadow .15s}
.sl-h:focus-visible::before{box-shadow:0 0 0 5px rgba(255,59,59,.45)}
.sl.drag .sl-h{cursor:grabbing}
.sl.drag .sl-h::before{transform:scale(1.15);box-shadow:0 0 0 8px rgba(225,29,46,.24),0 2px 8px rgba(0,0,0,.6)}
.pick{flex:1 1 100%;min-height:42px;display:flex;align-items:center;gap:8px;font:13px Inter,system-ui,sans-serif;letter-spacing:0;text-transform:none;background:#0a0a0d;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:0 12px;cursor:pointer;text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.pick:hover{border-color:rgba(255,59,59,.5)}
.pick::after{content:'';flex:none;width:7px;height:7px;margin:-3px 2px 0 auto;border-right:2px solid var(--red2);border-bottom:2px solid var(--red2);transform:rotate(45deg)}
.sheet-ov{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.sheet{width:min(520px,100%);max-height:74vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#16161c,#0c0c10);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -1px 0 rgba(225,29,46,.55),0 -20px 60px rgba(0,0,0,.6);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .26s cubic-bezier(.2,.8,.2,1)}
.sheet-h{flex:none;padding:16px 18px 8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.sheet-l{overflow:auto;padding:0 8px 12px;scrollbar-width:thin;scrollbar-color:#3a3a44 transparent;overscroll-behavior:contain}
.sheet-g{padding:14px 10px 4px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red2)}
.opt{display:flex;align-items:center;width:100%;min-height:46px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--fg);font:14px Inter,system-ui,sans-serif;text-align:left;cursor:pointer}
.opt:hover{background:rgba(255,255,255,.05)}
.opt[aria-selected=true]{background:linear-gradient(90deg,rgba(225,29,46,.24),transparent);color:#fff;font-weight:600;box-shadow:inset 2px 0 0 var(--red2)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateY(28px);opacity:0}}

@media (min-width:820px){

 #grip{display:none}
 #panel:not(.open) #ctl{display:grid}
 #ctl{grid-template-columns:1fr}
}

@media (min-width:1500px) and (hover:hover){
 nav button[data-n]::before{content:attr(data-n);display:inline-block;margin-right:9px;padding:1px 6px;border:1px solid var(--line);border-radius:5px;font:600 10px ui-monospace,Menlo,monospace;color:var(--mut)}
 nav button.on[data-n]::before{border-color:var(--red2);color:var(--red2)}
}
@media (min-width:820px) and (max-width:1499px){nav{gap:0}nav button{padding:0 12px;font-size:11px;letter-spacing:.1em}}
@media (min-width:1280px){#ro{font-size:13px}#ctl label{font-size:11px}}
@media (min-width:820px) and (max-height:820px){
 #ctl label{margin:5px 0}#ctl select,.pick{min-height:36px}.sl{height:32px}#ctl input[type=range]{height:24px}
 #ro{padding:12px 20px 10px}nav button{min-height:46px}
}
@media (min-width:1700px){
 body{grid-template-columns:minmax(0,1fr) 540px}
 #ctl{grid-template-columns:1fr 1fr;gap:0 24px}

#pt{display:flex;align-items:center;gap:8px;position:absolute;left:10px;bottom:10px;z-index:4;min-height:44px;padding:0 16px 0 12px;border-radius:999px;background:rgba(8,8,10,.78);border:1px solid var(--line);color:var(--fg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:700 11px Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .15s}

#tip.on{opacity:1;transform:translateX(-50%)}
nav{position:relative;overscroll-behavior-x:contain;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--ml,0px),#000 calc(100% - var(--mr,0px)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--ml,0px),#000 calc(100% - var(--mr,0px)),transparent 100%)}
.nv{display:none}
nav a#home{flex:none;display:inline-flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;padding:0 14px 0 6px;min-height:44px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border-right:1px solid var(--line);margin-right:6px}
nav a#home:hover{color:#fff}
@media (min-width:820px){nav a#home{min-height:54px;font-size:11.5px}}
@media (min-width:820px){
 #pt{top:12px;bottom:auto;left:12px}
 #tip{bottom:24px}
 body.nopanel{grid-template-columns:minmax(0,1fr)}
 body.nopanel #panel{display:none}
 body.nopanel #stage{margin-right:16px}
 nav{-webkit-mask-image:none;mask-image:none}
 .nv{display:grid;place-items:center;position:sticky;z-index:5;flex:none;width:40px;height:100%;min-height:46px;border:0;color:#fff;font-size:20px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s}
 .nv.on{opacity:1;pointer-events:auto}
 #nl{left:0;margin-right:-40px;background:linear-gradient(90deg,#050507 40%,transparent)}
 #nr{right:0;margin-left:-40px;background:linear-gradient(270deg,#050507 40%,transparent)}
}

<body>
<nav id="tabs"><a id="home" href="./" aria-label="Back to home page">&#8249; Home</a></nav>
<div id="stage"><canvas id="g"></canvas><canvas id="d"></canvas><canvas id="t"></canvas><canvas id="p"></canvas><canvas id="r"></canvas><div id="hint"></div><button id="reset" aria-label="Reset view">⟲</button></div>
<div id="panel" class="open"><button id="grip" aria-label="Show or hide controls"><span></span></button><div id="ro"></div><div id="ctl"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const Pick={bind(btn,title,opts,get,set,groups){
  const sync=()=>{btn.textContent=opts[get()]};sync();
  btn.setAttribute('aria-haspopup','listbox');
  btn.onclick=e=>{
    e.preventDefault();
    const ov=document.createElement('div');ov.className='sheet-ov';
    ov.innerHTML='<div class="sheet" role="listbox"><div class="sheet-h"></div><div class="sheet-l"></div></div>';
    ov.querySelector('.sheet-h').textContent=title;
    const list=ov.querySelector('.sheet-l');let sel=null;
    const close=()=>{ov.remove();removeEventListener('keydown',key)},key=k=>{if(k.key=='Escape')close()};
    opts.forEach((o,i)=>{
      if(groups&&groups[i]){const g=document.createElement('div');g.className='sheet-g';g.textContent=groups[i];list.append(g)}
      const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=o;b.setAttribute('role','option');
      const on=i==get();b.setAttribute('aria-selected',on);if(on)sel=b;
      b.onclick=()=>{close();set(i);sync()};list.append(b);
    });
    ov.onclick=k=>{if(k.target==ov)close()};
    addEventListener('keydown',key);document.body.append(ov);
    if(sel)sel.scrollIntoView({block:'center'});
  };
}};
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
/* Slider: only the thumb responds to touch, so swiping to scroll the panel never changes a value */
const Slide={make(min,max,step,val,on){
  const el=document.createElement('div');el.className='sl';
  el.innerHTML='<div class="sl-t"><div class="sl-f"></div></div><div class="sl-h" role="slider" tabindex="0"></div>';
  const h=el.querySelector('.sl-h'),f=el.querySelector('.sl-f');let v=val,drag=null;
  h.setAttribute('aria-valuemin',min);h.setAttribute('aria-valuemax',max);
  const q=x=>{const k=Math.round((x-min)/step);return Math.min(max,Math.max(min,+(min+k*step).toFixed(6)))};
  const paint=()=>{const fr=(v-min)/(max-min);h.style.left='calc(12px + (100% - 24px) * '+fr+')';f.style.width=fr*100+'%';h.setAttribute('aria-valuenow',v)};
  const set=x=>{x=q(x);if(x!==v){v=x;paint();on(v)}};
  const fromX=cx=>{const r=el.getBoundingClientRect();return min+(max-min)*Math.min(1,Math.max(0,(cx-r.left-12)/Math.max(1,r.width-24)))};
  const end=()=>{drag=null;el.classList.remove('drag')};
  paint();
  h.addEventListener('pointerdown',e=>{e.stopPropagation();drag={x:e.clientX,off:0,on:e.pointerType=='mouse'};
    if(drag.on){drag.off=fromX(e.clientX)-v;el.classList.add('drag')}h.setPointerCapture(e.pointerId)});
  /* mouse only: clicking the track jumps; touch taps on the track are ignored */
  el.addEventListener('pointerdown',e=>{if(e.target===h||e.pointerType!='mouse')return;set(fromX(e.clientX));drag={x:e.clientX,off:0,on:true};el.classList.add('drag');h.setPointerCapture(e.pointerId)});
  h.addEventListener('pointermove',e=>{if(!drag)return;
    if(!drag.on){if(Math.abs(e.clientX-drag.x)<6)return;drag.on=true;drag.off=fromX(e.clientX)-v;el.classList.add('drag')}
    set(fromX(e.clientX)-drag.off)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>h.addEventListener(n,end));
  h.addEventListener('keydown',e=>{const k={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1,PageUp:10,PageDown:-10}[e.key];
    if(k){e.preventDefault();set(v+k*step)}else if(e.key=='Home'){e.preventDefault();set(min)}else if(e.key=='End'){e.preventDefault();set(max)}});
  return el;
}};
const Optics=(()=>{const api={on(){},off(){}};let active=0;

/* ================= Physics core: planar ray tracer (2D cross-section, extruded in z) ================= */
const Phys={
  nOf:(n0,disp,l)=>n0+disp*(1/(l*l)-1/.3025),               // Cauchy-like dispersion, l in micrometres
  fresnel(n1,n2,ci,ct,pol){
    const rs=((n1*ci-n2*ct)/(n1*ci+n2*ct))**2,rp=((n1*ct-n2*ci)/(n1*ct+n2*ci))**2;
    return pol==0?(rs+rp)/2:pol==1?rs:rp;
  },
  /* Unpolarized light = incoherent 50/50 mix of s and p. s and p never mix at a planar interface,
     so trace each separately at half intensity, then merge identical segments. */
  trace(P,mirror,n0,disp,pol,rays){
    if(pol||mirror)return Phys.trace1(P,mirror,n0,disp,pol,rays);
    const half=rays.map(r=>({...r,I:r.I*.5})),A=Phys.trace1(P,mirror,n0,disp,1,half,.5),B=Phys.trace1(P,mirror,n0,disp,2,half,.5);
    const mp=new Map(),segs=[],key=q=>[q.x1,q.y1,q.x2,q.y2].map(v=>v.toFixed(4)).join()+'|'+q.c.getHex()+'|'+(q.z||0);
    for(const q of A.segs.concat(B.segs)){const k=key(q),e=mp.get(k);if(e)e.I+=q.I;else{const c={...q};mp.set(k,c);segs.push(c)}}
    const hits=A.hits.map(h=>{if(h.k!==0||!h.m)return h;
      const o=B.hits.find(g=>g.k===0&&g.m&&Math.abs(g.px-h.px)<1e-6&&Math.abs(g.py-h.py)<1e-6);
      return o?{...h,R:(h.R+o.R)/2}:h});
    return{segs,hits};
  },
  trace1(P,mirror,n0,disp,pol,rays,sc=1){
    const segs=[],hits=[],q=rays.slice();
    while(q.length){
      const r=q.pop();let best=1e9,E=null;
      for(let i=0;i<P.length;i++){
        const a=P[i],b=P[(i+1)%P.length],ex=b[0]-a[0],ey=b[1]-a[1],den=r.dx*ey-r.dy*ex;
        if(Math.abs(den)<1e-9)continue;
        const t=((a[0]-r.x)*ey-(a[1]-r.y)*ex)/den,u=((a[0]-r.x)*r.dy-(a[1]-r.y)*r.dx)/den;
        if(t>1e-4&&u>=0&&u<=1&&t<best){best=t;E=[ey,-ex]}
      }
      if(!E){segs.push({x1:r.x,y1:r.y,x2:r.x+r.dx*16,y2:r.y+r.dy*16,I:r.I,c:r.c,z:r.z});continue}
      const px=r.x+r.dx*best,py=r.y+r.dy*best;
      segs.push({x1:r.x,y1:r.y,x2:px,y2:py,I:r.I,c:r.c,z:r.z});
      const L=Math.hypot(E[0],E[1]);let nx=E[0]/L,ny=E[1]/L;
      const entering=r.dx*nx+r.dy*ny<0;if(!entering){nx=-nx;ny=-ny}   // normal now opposes the ray
      const ci=-(r.dx*nx+r.dy*ny);

  const R=Math.max(4,s.t==0?Math.sqrt(2*s.n+1)+1.2:s.t==1?Math.SQRT2*s.a+2:s.t==2?1.8*Math.exp(s.r):3*Math.sqrt(s.nb+.5));
  for(let j=0;j<G;j++)for(let i=0;i<G;i++){const v=Q.wigner(s,(i/G-.5)*2*R,(.5-j/G)*2*R);vals[j*G+i]=v;mx=Math.max(mx,Math.abs(v))}
  const o=off.getContext('2d'),im=o.createImageData(G,G);
  for(let k=0;k<G*G;k++){const t=vals[k]/mx,a=Math.pow(Math.abs(t),.7),c=t>0?[255,40,55]:[225,230,245];
    for(let q=0;q<3;q++)im.data[k*4+q]=14+a*(c[q]-14);im.data[k*4+3]=255}
  o.putImageData(im,0,0);const x0=(w-sq)/2;
  ctx.imageSmoothingEnabled=true;ctx.drawImage(off,x0,6,sq,sq);
  ctx.strokeStyle=GR;ctx.strokeRect(x0,6,sq,sq);ctx.beginPath();ctx.moveTo(x0+sq/2,6);ctx.lineTo(x0+sq/2,6+sq);ctx.moveTo(x0,6+sq/2);ctx.lineTo(x0+sq,6+sq/2);ctx.stroke();
  text('Wigner W(x,p), window ±'+R.toFixed(1)+' · red +, white − (nonclassical)',x0+4,sq+20);
  const P=Q.photon(s,200),st=Q.stats(P),by=sq+36;
  bars(14,by,w-28,Math.max(h-by-22,30),P.slice(0,16),Math.max(...P.slice(0,16),.05)*1.1,null,C);
  $('#ro').innerHTML='⟨n⟩ = <b>'+st.mean.toFixed(2)+'</b> · g⁽²⁾(0) = <b>'+(isNaN(st.g2)?'—':st.g2.toFixed(2))+'</b> · '+(st.g2<.999?'sub-Poissonian (nonclassical)':st.g2>1.001?'super-Poissonian (bunched)':'Poissonian');
};
/* ---------- HOM ---------- */
M.hom.draw=(w,h)=>{
  const s=S.hom,pad=14,hh=(h-pad*4)/2,Pc=Q.hom(s.R,s.V,s.tau);

/* ---------- 3D mirror room (ray-traced, WebGL2) ---------- */
const FS=`#version 300 es
precision highp float;
uniform vec2 R;uniform float T,Rf,Dd,SC;uniform vec3 P,H,MA;uniform vec2 A;uniform int N,RM,NS,TI;
out vec4 O;
float sph(vec3 ro,vec3 rd,vec3 c,float r){vec3 oc=ro-c;float b=dot(oc,rd);float h=b*b-dot(oc,oc)+r*r;if(h<0.)return -1.;h=-b-sqrt(h);return h>1e-3?h:-1.;}
void main(){
  vec2 uv=(gl_FragCoord.xy*2.-R)/R.y;
  float cy=cos(A.x),sy=sin(A.x),cp=cos(A.y),sp=sin(A.y);
  vec3 f=vec3(sy*cp,sp,-cy*cp),r=vec3(cy,0.,sy),u=cross(r,f);
  vec3 rd=normalize(f*1.3+r*uv.x+u*uv.y),ro=P;
  vec3 L=SC*vec3(2.2*cos(T*.4),.3+.8*sin(T*.7),2.2*sin(T*.4)),S1=vec3(-1.8*SC,-H.y+.8*SC,-1.5*SC),S2=vec3(2.*SC,-H.y+.6*SC,SC);
  float rl=.3*SC,r1=.8*SC,r2=.6*SC;
  vec3 col=vec3(0.),th=vec3(1.);
  for(int i=0;i<32;i++){
    if(i>=N)break;
    float tw=1e9,wid=0.;vec3 n=vec3(0.,1.,0.);
    if(RM<3){
      vec3 s=sign(rd),tt=(s*H-ro)/rd;tw=min(min(tt.x,tt.y),tt.z);
      n=tt.x<=tw?vec3(-s.x,0,0):tt.y<=tw?vec3(0,-s.y,0):vec3(0,0,-s.z);
      wid=tt.x<=tw?0.:tt.y<=tw?.33:.66;
    }else if(RM==5){
      float b=dot(ro,rd),c=dot(ro,ro)-Dd*Dd;tw=-b+sqrt(max(b*b-c,0.));
      vec3 pp=ro+rd*tw;n=-pp/Dd;wid=atan(pp.z,pp.x)/6.2831853+.5;
    }else{
      tw=((rd.y>0.?H.y:-H.y)-ro.y)/rd.y;n=vec3(0.,-sign(rd.y),0.);wid=.5;
      if(RM==3){
        for(int k=0;k<12;k++){
          if(k>=NS)break;
          float a=6.2831853*float(k)/float(NS)+.5236;vec3 nk=vec3(cos(a),0.,sin(a));float dn=dot(rd,nk);
          if(dn>1e-4){float t=(Dd-dot(ro,nk))/dn;if(t<tw){tw=t;n=-nk;wid=float(k)/float(NS);}}
        }
      }else{
        float a=dot(rd.xz,rd.xz),b=dot(ro.xz,rd.xz),c=dot(ro.xz,ro.xz)-Dd*Dd;
        if(a>1e-6){float t=(-b+sqrt(max(b*b-a*c,0.)))/a;
          if(t<tw){tw=t;vec3 pp=ro+rd*t;n=vec3(-pp.x,0.,-pp.z)/Dd;wid=atan(pp.z,pp.x)/6.2831853+.5;}}
      }
    }
    float tm=tw;int id=0;
    float a=sph(ro,rd,L,rl);if(a>0.&&a<tm){tm=a;id=1;}
    a=sph(ro,rd,S1,r1);if(a>0.&&a<tm){tm=a;id=2;}
    a=sph(ro,rd,S2,r2);if(a>0.&&a<tm){tm=a;id=3;}
    float tc=clamp(dot(L-ro,rd),0.,tm);float d=length(ro+rd*tc-L);
    col+=th*vec3(1.,.75,.45)*.03/(d*d+.04);
    vec3 p=ro+rd*tm;
    if(id==1){col+=th*vec3(1.,.92,.75)*7.;break;}
    vec3 nn=n,alb=vec3(.5),tint=vec3(1.);float refl=Rf;
    if(id==0){
      if(TI==0)tint=abs(n.x)>.5?vec3(.95,.8,.8):abs(n.z)>.5?vec3(1.,.9,.86):vec3(.82,.8,.82);
      else if(TI==1)tint=vec3(1.,.84,.55);
      else tint=mix(vec3(1.),.5+.5*cos(6.2831853*(wid+vec3(0.,.33,.67))),.8);
      vec3 w=abs(fract(p+.5)-.5)+abs(n)*10.;float seam=smoothstep(0.,.035,min(min(w.x,w.y),w.z));
      col+=th*vec3(.95,.08,.1)*(1.-seam)*.16;
      if(dot(abs(n),MA)>.5)refl*=mix(.4,1.,seam);else{refl=.07;alb=vec3(.6)*tint;tint=vec3(1.);}
    }else if(id==2){nn=normalize(p-S1);refl=.85;alb=vec3(.9);}
    else{nn=normalize(p-S2);refl=.3;alb=vec3(.9,.15,.12);}
    vec3 l=L-p;float dl=length(l);l/=dl;
    col+=th*alb*max(dot(nn,l),0.)/(1.+.15*dl*dl)*(1.-refl)*vec3(1.,.85,.65)*1.6;
    th*=refl*tint;ro=p+nn*1e-3;rd=reflect(rd,nn);
    if(max(th.r,max(th.g,th.b))<.003)break;
  }
  col=1.-exp(-col*1.2);O=vec4(pow(col,vec3(.4545)),1.);
}`;
const gl=gc.getContext('webgl2'),cam={x:0,y:-.8,z:2.5,yaw:0,pitch:0},keys={};let U={};
if(gl){
  const mk=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x},pr=gl.createProgram();
  gl.attachShader(pr,mk(gl.VERTEX_SHADER,'#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0,1);}'));
  gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
  ['R','T','Rf','P','A','N','RM','NS','TI','Dd','SC','H','MA'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
}
M.room.draw=(now,dt)=>{
  const s=S.room,T=RTY[s.rt],f=(keys.w?1:0)-(keys.s?1:0),sd=(keys.d?1:0)-(keys.a?1:0),v=2.5*dt;
  cam.x+=(Math.sin(cam.yaw)*f+Math.cos(cam.yaw)*sd)*v;cam.z+=(-Math.cos(cam.yaw)*f+Math.sin(cam.yaw)*sd)*v;
  if(T.m<3){cam.x=Math.max(-(T.H[0]-.35),Math.min(T.H[0]-.35,cam.x));cam.z=Math.max(-(T.H[2]-.35),Math.min(T.H[2]-.35,cam.z))}
  else{const mx=T.D-.5,q=Math.hypot(cam.x,cam.z);if(q>mx){cam.x*=mx/q;cam.z*=mx/q}}
  const cap=T.m==3||T.m==4?s.cp:1;
  gl.viewport(0,0,gc.width,gc.height);
  gl.uniform2f(U.R,gc.width,gc.height);gl.uniform1f(U.T,now/1000);gl.uniform1f(U.Rf,s.rf);
  gl.uniform3f(U.P,cam.x,cam.y,cam.z);gl.uniform2f(U.A,cam.yaw,cam.pitch);gl.uniform1i(U.N,s.n);
  gl.uniform1i(U.RM,T.m);gl.uniform1i(U.NS,T.m==3?s.ns:0);gl.uniform1i(U.TI,s.tn);gl.uniform1f(U.Dd,T.D||0);gl.uniform1f(U.SC,T.sc);
  gl.uniform3f(U.H,...T.H);gl.uniform3f(U.MA,...(T.m>=3?[1,cap,1]:T.MA));
  gl.drawArrays(gl.TRIANGLES,0,3);
};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let drag=null;
gc.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];gc.setPointerCapture(e.pointerId)});
gc.addEventListener('pointermove',e=>{if(!drag)return;cam.yaw+=(e.clientX-drag[0])*.005;
  cam.pitch=Math.max(-1.4,Math.min(1.4,cam.pitch-(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY]});

/* ---------- Shell: tabs, controls, layout, loop ---------- */
function build(){
  const m=M[cur],box=$('#ctl');box.innerHTML='';
  m.c.forEach(c=>{
    if(c.when&&!c.when(S[cur]))return;
    const d=document.createElement('label'),s=S[cur];
    if(c.o){
      d.innerHTML=c.l+'<button type="button" class="pick"></button>';
      Pick.bind(d.querySelector('button'),c.l,c.o,()=>s[c.id],v=>{s[c.id]=v;build();dirty=1},c.g);
    }else{
      d.innerHTML=c.l+' <b>'+s[c.id]+'</b>';const b=d.querySelector('b');
      d.append(Slide.make(c.min,c.max,c.step,s[c.id],v=>{s[c.id]=v;b.textContent=v;dirty=1}));
    }
    box.append(d);
  });
  if(cur=='room'){
    $('#ro').textContent=RTY[S.room.rt].d+' Drag to look · WASD or hold the button to walk.';
    const b=document.createElement('button');b.id='walk';b.textContent='Hold to walk forward';
    b.onpointerdown=e=>{keys.w=1;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys.w=0;box.append(b);
  }
}
function fit(){
  const r=$('#stage').getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);
  for(const c of[gc,dc]){c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d)}
  ctx.setTransform(d,0,0,d,0,0);dirty=1;
}
function show(k){
  cur=k;gc.style.display=k=='room'?'block':'none';tc.style.display=k=='optics'?'block':'none';pc.style.display=k=='pol'?'block':'none';$('#r').style.display=k=='ray'?'block':'none';dc.style.display=(k=='room'||k=='optics'||k=='pol'||k=='ray')?'none':'block';
  document.querySelectorAll('#tabs button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k==k));
  Optics.off();Pol3D.off();RayRoom.off();if(k=='optics'){$('#ctl').innerHTML='';Optics.on()}else{build();if(k=='pol')Pol3D.on();if(k=='ray')RayRoom.on()}
  fit();
  const hs=$('#hint');
  hs.textContent={optics:'Drag to orbit · '+(matchMedia('(pointer:fine)').matches?'scroll':'pinch')+' to zoom',room:matchMedia('(pointer:fine)').matches?'Drag to look · W A S D to move':'Drag to look · hold Walk to move',cavity:'Raise R to sharpen the peaks',states:'Fock states have negative Wigner regions',pol:'Rotate the polarizer: Malus law in 3D',ray:'Drag to orbit · change the angles to reshape the pattern',slit:'Photons land one at a time',bell:'Quantum S beats the classical bound 2',hom:'Set τ = 0 for the perfect dip'}[k]||'';
  hs.classList.add('on');clearTimeout(show.t);show.t=setTimeout(()=>hs.classList.remove('on'),4500);
  $('#reset').style.display=k=='optics'?'block':'none';
}
Object.keys(M).forEach(k=>{const b=document.createElement('button');b.textContent=M[k].n;b.dataset.k=k;b.onclick=()=>show(k);$('#tabs').append(b)});
addEventListener('resize',fit);new ResizeObserver(fit).observe($('#stage'));
let last=performance.now();
(function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(cur=='room'){if(gl)M.room.draw(now,dt)}
  else if((dirty||M[cur].anim)&&M[cur].draw){const r=$('#stage').getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);M[cur].draw(r.width,r.height);dirty=0}
  requestAnimationFrame(frame);
})(last);
$('#grip').onclick=()=>{$('#panel').classList.toggle('open');fit()};
const paint=r=>r.style.setProperty('--p',(r.value-r.min)/(r.max-r.min)*100+'%');
document.addEventListener('input',e=>{if(e.target.type=='range')paint(e.target)});
new MutationObserver(()=>document.querySelectorAll('#ctl input[type=range]').forEach(paint)).observe($('#ctl'),{childList:true});
$('#reset').onclick=()=>Optics.reset();
show('optics');

<script>

<script>
/* Smart controls: auto-hide on touch-drag, remembers your place, friendly tab strip */
(function(){var $=function(q){return document.querySelector(q)},st=$('#stage'),pn=$('#panel'),nav=$('#tabs'),B=document.body;
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var desk=function(){return innerWidth>=820};
var pt=document.createElement('button');pt.id='pt';pt.type='button';

nav.addEventListener('click',function(e){var b=e.target.closest('button[data-k]');if(!b)return;store.set('qol-tab',b.dataset.k);setC(false)});
addEventListener('keydown',function(e){if((e.key!=='['&&e.key!==']')||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;var bs=[].slice.call(nav.querySelectorAll('button[data-k]')),i=bs.findIndex(function(b){return b.classList.contains('on')});var n=bs[i+(e.key===']'?1:-1)];if(n)n.click()});

var last=store.get('qol-tab');if(last){var tb=nav.querySelector('button[data-k="'+last+'"]');if(tb&&!tb.classList.contains('on'))tb.click()}
edges();setTimeout(function(){edges();center()},400);
